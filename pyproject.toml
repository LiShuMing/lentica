[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lentica"
version = "0.1.0"
description = "Local-first multimodal search for your photos and documents"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "LiShuMing"}]
keywords = ["rag", "multimodal", "photos", "local-first", "semantic-search"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.1,<2",
  "scikit-learn>=1.4,<2",
  "Pillow>=10.4,<13",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
models = ["torch>=2.4,<3", "transformers>=4.51,<5", "qwen-vl-utils>=0.0.10,<1", "accelerate>=1,<2"]
faces = ["insightface>=0.7.3,<0.8", "onnxruntime>=1.19,<2", "opencv-python-headless>=4.10,<5"]
heif = ["pillow-heif>=0.18,<2"]
retrieval-indexes = ["faiss-cpu==1.8.0.post1", "tantivy==0.22.0", "pyarrow==15.0.2"]
retrieval-ocr = ["rapidocr-onnxruntime==1.3.24", "onnxruntime==1.16.3", "opencv-python==4.11.0.86"]
retrieval-models = ["torch>=2.6,<3", "transformers>=4.51,<5"]
retrieval-vision = ["onnxruntime==1.16.3", "transformers>=4.51,<5", "sentencepiece==0.2.0"]
retrieval-speech-eval = ["av==14.2.0", "pyarrow==15.0.2", "onnxruntime==1.16.3", "transformers>=4.51,<5"]
retrieval-video = ["opencv-python==4.11.0.86", "torch>=2.6,<3", "transformers>=4.51,<5"]
retrieval-query-adaptation = ["onnxruntime==1.16.3", "transformers>=4.51,<5", "sentencepiece==0.2.0", "sacremoses==0.1.1"]
retrieval-relation-models = ["torch>=2.6,<3", "transformers>=4.57,<5"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "build>=1,<2", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/LiShuMing/lentica"
Repository = "https://github.com/LiShuMing/lentica"
Issues = "https://github.com/LiShuMing/lentica/issues"

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests", "apps/media-workflow/tests", "examples/multimodal-agent/tests"]
pythonpath = [".", "apps/media-workflow", "examples/multimodal-agent"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
