name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      LENTICA_DATA_DIR: /tmp/lentica-ci-data
      LENTICA_QUEUE_ENABLED: 'false'
      LENTICA_ENABLE_FACES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/check_workspace.py
      - name: Require a spec for behavior changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "$BASE_SHA"
            python scripts/check_workspace.py --base "$BASE_SHA"
          fi
      - run: ruff check backend scripts tests apps examples services labs learning
      - run: ruff format --check scripts tests apps examples services labs learning
      - run: python -m pytest
      - run: python -m build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
